name: "Spot Auto Poster New"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 10 * * 1,5'

concurrency:
  group: "auto-poster-queue"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai requests pillow

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_spot.py

      - name: Commit to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto Update Spot Posts (8 Carousel Images)" || echo "No changes"
          git pull --rebase origin main || true
          git push

      - name: Setup Cache Buster and Wait
        run: |
          echo "CACHE_BUSTER=$(date +%s)" >> $GITHUB_ENV
          echo "⏳ 為了避免觸發 GitHub CDN 的「404 負面快取」，先暫停 60 秒讓伺服器背景部署..."
          sleep 60

      - name: Wait for GitHub Pages to Deploy
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          
          echo "🔍 準備檢查 ${#IMG_ARRAY[@]} 張圖片是否已全部同步至 GitHub Pages CDN..."
          
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}?v=${CACHE_BUSTER}"
            echo "👉 正在檢查：$IMG_URL"
            
            SUCCESS=false
            for i in {1..40}; do
              HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" "$IMG_URL")
              if [ "$HTTP_STATUS" == "200" ]; then
                echo "  ✅ 此圖片已成功上線！"
                SUCCESS=true
                break
              fi
              echo "  ⏳ 尚未上線 (狀態碼: $HTTP_STATUS)... 等待 15 秒後重試 ($i/40)"
              sleep 15
            done
            
            if [ "$SUCCESS" = false ]; then
              echo "❌ 致命錯誤：圖片同步超時，中止流程以避免 Meta API 抓取失敗。"
              exit 1
            fi
          done
          
          echo "🎉 所有圖片均已確認上線！緩衝 10 秒後準備進入發布流程..."
          sleep 10

      - name: Post to Threads (Carousel + 4 Comments)
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          CLEAN_TOKEN=$(echo -n "$TOKEN" | tr -d '\r\n ')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          CHILDREN=""
          
          echo "📤 [Threads] 正在上傳 8 張圖片至暫存區..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}?v=${CACHE_BUSTER}"
            RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=IMAGE" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$CLEAN_TOKEN")
            ID=$(echo $RES | jq -r '.id')
            if [ "$ID" != "null" ] && [ -n "$ID" ]; then
              CHILDREN="${CHILDREN}${ID},"
            else
              echo "⚠️ [Threads Debug] 圖片上傳異常！Meta 回傳：$RES"
            fi
            sleep 3
          done
          CHILDREN=${CHILDREN%,}
          
          if [ -z "$CHILDREN" ]; then
            echo "❌ [Threads] 致命錯誤：沒有任何一張圖片成功上傳！"
            exit 1
          fi
          
          echo "📤 [Threads] 正在建立輪播主文容器..."
          RES_MAIN=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode text@caption.txt -d "access_token=$CLEAN_TOKEN")
          MAIN_ID=$(echo $RES_MAIN | jq -r '.id')
          
          if [ "$MAIN_ID" == "null" ] || [ -z "$MAIN_ID" ]; then
             echo "❌ [Threads] 致命錯誤：建立主文容器失敗！"
             exit 1
          fi
          
          echo "⏳ [Threads] 正在等待 Meta 伺服器轉檔處理..."
          for j in {1..40}; do
            STATUS_RES=$(curl -s -X GET "https://graph.threads.net/v1.0/$MAIN_ID?fields=status,error_message&access_token=$CLEAN_TOKEN")
            STATUS=$(echo $STATUS_RES | jq -r '.status')
            if [ "$STATUS" == "FINISHED" ]; then
              echo "✅ [Threads] 伺服器處理完成！準備發布！"
              break
            fi
            if [ "$STATUS" == "ERROR" ]; then
              exit 1
            fi
            sleep 10
          done

          echo "📤 [Threads] 正在正式發布貼文..."
          PUBLISH_RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$MAIN_ID&access_token=$CLEAN_TOKEN")
          POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          echo "✅ [Threads] 主文發布成功！ID: $POST_ID"
          
          for i in {1..4}; do
            if [ -f "comment${i}.txt" ]; then
              curl -s -X POST "https://graph.threads.net/v1.0/me/threads" --data-urlencode "media_type=TEXT" --data-urlencode text@comment${i}.txt --data-urlencode "reply_to_id=$POST_ID" --data-urlencode "access_token=$CLEAN_TOKEN" > temp_res.json
              COMMENT_ID=$(cat temp_res.json | jq -r '.id')
              curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$COMMENT_ID&access_token=$CLEAN_TOKEN" > /dev/null
              sleep 15
            fi
          done

      - name: Post to Instagram (Carousel)
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: |
          CLEAN_META_TOKEN=$(echo -n "$META_TOKEN" | tr -d '\r\n ')
          CLEAN_IG_ID=$(echo -n "$IG_ID" | tr -d '\r\n ')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          CHILDREN=""
          
          echo "📤 [IG] 正在上傳圖片至暫存區..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}?v=${CACHE_BUSTER}"
            RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_IG_ID/media" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$CLEAN_META_TOKEN")
            ID=$(echo $RES | jq -r '.id')
            if [ "$ID" != "null" ] && [ -n "$ID" ]; then
              CHILDREN="${CHILDREN}${ID},"
            fi
            sleep 3
          done
          CHILDREN=${CHILDREN%,}
          
          if [ -z "$CHILDREN" ]; then
            exit 1
          fi
          
          RES_MAIN=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_IG_ID/media" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode caption@caption.txt -d "access_token=$CLEAN_META_TOKEN")
          MAIN_ID=$(echo $RES_MAIN | jq -r '.id')
          
          if [ "$MAIN_ID" == "null" ] || [ -z "$MAIN_ID" ]; then
             exit 1
          fi
          
          for j in {1..40}; do
            STATUS_RES=$(curl -s -X GET "https://graph.facebook.com/v20.0/$MAIN_ID?fields=status_code&access_token=$CLEAN_META_TOKEN")
            STATUS=$(echo $STATUS_RES | jq -r '.status_code')
            if [ "$STATUS" == "FINISHED" ]; then
              break
            fi
            if [ "$STATUS" == "ERROR" ]; then
              exit 1
            fi
            sleep 10
          done

          PUBLISH_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_IG_ID/media_publish" -d "creation_id=$MAIN_ID" -d "access_token=$CLEAN_META_TOKEN")
          IG_POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          
          if [ "$IG_POST_ID" != "null" ] && [ -n "$IG_POST_ID" ]; then
            for i in {1..4}; do
              if [ -f "comment${i}.txt" ]; then
                curl -s -X POST "https://graph.facebook.com/v20.0/$IG_POST_ID/comments" --data-urlencode message@comment${i}.txt -d "access_token=$CLEAN_META_TOKEN" > /dev/null
                sleep 5
              fi
            done
          fi

      - name: Post to Facebook Page (Multi-Photo)
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          CLEAN_META_TOKEN=$(echo -n "$META_TOKEN" | tr -d '\r\n ')
          CLEAN_FB_PAGE_ID=$(echo -n "$FB_PAGE_ID" | tr -d '\r\n ')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          ATTACHED_MEDIA="["
          
          echo "📤 [FB] 正在上傳未公開的照片..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}?v=${CACHE_BUSTER}"
            RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_FB_PAGE_ID/photos" -d "url=$IMG_URL" -d "published=false" -d "access_token=$CLEAN_META_TOKEN")
            PHOTO_ID=$(echo $RES | jq -r '.id')
            if [ "$PHOTO_ID" != "null" ] && [ -n "$PHOTO_ID" ]; then
              ATTACHED_MEDIA+="{\"media_fbid\":\"$PHOTO_ID\"},"
            fi
            sleep 3
          done
          ATTACHED_MEDIA=${ATTACHED_MEDIA%,}"]"
          
          PUBLISH_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_FB_PAGE_ID/feed" --data-urlencode message@caption.txt -d "attached_media=$ATTACHED_MEDIA" -d "access_token=$CLEAN_META_TOKEN")
          FB_POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          
          if [ "$FB_POST_ID" != "null" ] && [ -n "$FB_POST_ID" ]; then
            for i in {1..4}; do
              if [ -f "comment${i}.txt" ]; then
                curl -s -X POST "https://graph.facebook.com/v20.0/$FB_POST_ID/comments" --data-urlencode message@comment${i}.txt -d "access_token=$CLEAN_META_TOKEN" > /dev/null
                sleep 5
              fi
            done
          fi
