name: "Spot Auto Poster New"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 10 * * 1,5'

concurrency:
  group: "auto-poster-queue"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai requests pillow

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_spot.py

      - name: Commit to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto Update Spot Posts (8 Carousel Images)" || echo "No changes"
          git pull --rebase origin main || true
          git push

      - name: Wait for GitHub Pages to Deploy
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          FIRST_IMG_URL="${BASE_URL}/${IMG_ARRAY[0]}"
          
          echo "🔍 正在等待首圖上線：$FIRST_IMG_URL"
          for i in {1..20}; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" "$FIRST_IMG_URL")
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "✅ 圖片已成功上線！"
              break
            fi
            echo "⏳ 尚未上線 (狀態碼: $HTTP_STATUS)... 等待 15 秒後重試 ($i/20)"
            sleep 15
          done
          sleep 10

      - name: Post to Threads (Carousel + 4 Comments)
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          # 🛡️ 淨化 Token 隱藏的換行與空白
          CLEAN_TOKEN=$(echo -n "$TOKEN" | tr -d '\r\n ')
          
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          CHILDREN=""
          
          echo "📤 [Threads] 正在上傳 8 張圖片至暫存區..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}"
            RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=IMAGE" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$CLEAN_TOKEN")
            ID=$(echo $RES | jq -r '.id')
            if [ "$ID" != "null" ] && [ -n "$ID" ]; then
              CHILDREN="${CHILDREN}${ID},"
            else
              echo "⚠️ [Threads Debug] 圖片上傳異常！Meta 回傳：$RES"
            fi
            # 🛡️ 加入短暫延遲，避免連續上傳 8 張圖被 Meta 阻擋
            sleep 3
          done
          CHILDREN=${CHILDREN%,}
          
          if [ -z "$CHILDREN" ]; then
            echo "❌ [Threads] 致命錯誤：沒有任何一張圖片成功上傳，無法建立輪播貼文！"
            exit 1
          fi
          
          echo "📤 [Threads] 正在建立輪播主文容器..."
          RES_MAIN=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode text@caption.txt -d "access_token=$CLEAN_TOKEN")
          echo "🔍 [Threads Debug 容器回應]: $RES_MAIN"
          MAIN_ID=$(echo $RES_MAIN | jq -r '.id')
          
          if [ "$MAIN_ID" == "null" ] || [ -z "$MAIN_ID" ]; then
             echo "❌ [Threads] 致命錯誤：建立主文容器失敗！請查看上方的 Debug 容器回應。"
             exit 1
          fi
          
          echo "⏳ [Threads] 正在等待 Meta 伺服器轉檔處理 8 張圖片..."
          for j in {1..40}; do
            STATUS_RES=$(curl -s -X GET "https://graph.threads.net/v1.0/$MAIN_ID?fields=status,error_message&access_token=$CLEAN_TOKEN")
            STATUS=$(echo $STATUS_RES | jq -r '.status')
            if [ "$STATUS" == "FINISHED" ]; then
              echo "✅ [Threads] 伺服器處理完成！準備發布！"
              break
            fi
            if [ "$STATUS" == "ERROR" ]; then
              ERR_MSG=$(echo $STATUS_RES | jq -r '.error_message')
              echo "❌ [Threads] 伺服器處理失敗：$ERR_MSG"
              exit 1
            fi
            echo "⏳ 處理中 (目前狀態: $STATUS)... 等待 10 秒後重試 ($j/40)"
            sleep 10
          done

          echo "📤 [Threads] 正在正式發布貼文..."
          PUBLISH_RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$MAIN_ID&access_token=$CLEAN_TOKEN")
          POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          echo "✅ [Threads] 主文發布成功！ID: $POST_ID"
          
          echo "📤 [Threads] 準備依序發布 4 則交通資訊留言 (以串文接龍方式)..."
          CURRENT_REPLY_TARGET=$POST_ID 
          for i in {1..4}; do
            if [ -f "comment${i}.txt" ]; then
              echo "📤 [Threads] 建立留言 $i 的容器..."
              curl -s -X POST "https://graph.threads.net/v1.0/me/threads" \
                   --data-urlencode "media_type=TEXT" \
                   --data-urlencode text@comment${i}.txt \
                   --data-urlencode "reply_to_id=$CURRENT_REPLY_TARGET" \
                   --data-urlencode "access_token=$CLEAN_TOKEN" > temp_res.json
              
              COMMENT_CONTAINER_ID=$(cat temp_res.json | jq -r '.id')
              
              if [ "$COMMENT_CONTAINER_ID" != "null" ] && [ -n "$COMMENT_CONTAINER_ID" ]; then
                echo "📤 [Threads] 正在發布留言 $i (容器 ID: $COMMENT_CONTAINER_ID)..."
                PUBLISH_RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$COMMENT_CONTAINER_ID&access_token=$CLEAN_TOKEN")
                PUBLISHED_ID=$(echo $PUBLISH_RES | jq -r '.id')
                
                if [ "$PUBLISHED_ID" != "null" ] && [ -n "$PUBLISHED_ID" ]; then
                  echo "✅ [Threads] 留言 $i 發布成功！ID: $PUBLISHED_ID"
                  CURRENT_REPLY_TARGET=$PUBLISHED_ID
                else
                  echo "❌ [Threads] 留言 $i 發布失敗！API 回應：$PUBLISH_RES"
                fi
              else
                echo "❌ [Threads] 建立留言 $i 容器失敗！API 回應：$(cat temp_res.json)"
              fi
              sleep 15
            fi
          done

      - name: Post to Instagram (Carousel)
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: |
          # 🛡️ 淨化 Token 與 ID
          CLEAN_META_TOKEN=$(echo -n "$META_TOKEN" | tr -d '\r\n ')
          CLEAN_IG_ID=$(echo -n "$IG_ID" | tr -d '\r\n ')
          
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          CHILDREN=""
          
          echo "📤 [IG] 正在上傳圖片至暫存區..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}"
            RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_IG_ID/media" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$CLEAN_META_TOKEN")
            ID=$(echo $RES | jq -r '.id')
            if [ "$ID" != "null" ] && [ -n "$ID" ]; then
              CHILDREN="${CHILDREN}${ID},"
            else
              echo "⚠️ [IG Debug] 圖片上傳異常！Meta 回傳：$RES"
            fi
            sleep 3
          done
          CHILDREN=${CHILDREN%,}
          
          if [ -z "$CHILDREN" ]; then
            echo "❌ [IG] 致命錯誤：沒有任何一張圖片成功上傳，無法建立輪播貼文！"
            exit 1
          fi
          
          echo "📤 [IG] 正在建立輪播主文容器..."
          RES_MAIN=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_IG_ID/media" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode caption@caption.txt -d "access_token=$CLEAN_META_TOKEN")
          echo "🔍 [IG Debug 容器回應]: $RES_MAIN"
          MAIN_ID=$(echo $RES_MAIN | jq -r '.id')
          
          if [ "$MAIN_ID" == "null" ] || [ -z "$MAIN_ID" ]; then
             echo "❌ [IG] 致命錯誤：建立主文容器失敗！請查看上方的 Debug 容器回應。"
             exit 1
          fi
          
          echo "⏳ [IG] 正在等待 Meta 伺服器轉檔處理 8 張圖片..."
          for j in {1..40}; do
            STATUS_RES=$(curl -s -X GET "https://graph.facebook.com/v20.0/$MAIN_ID?fields=status_code&access_token=$CLEAN_META_TOKEN")
            STATUS=$(echo $STATUS_RES | jq -r '.status_code')
            if [ "$STATUS" == "FINISHED" ]; then
              echo "✅ [IG] 伺服器處理完成！準備發布！"
              break
            fi
            if [ "$STATUS" == "ERROR" ]; then
              echo "❌ [IG] 伺服器處理失敗！"
              exit 1
            fi
            echo "⏳ 處理中 (目前狀態: $STATUS)... 等待 10 秒後重試 ($j/40)"
            sleep 10
          done

          echo "📤 [IG] 正在正式發布貼文..."
          PUBLISH_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_IG_ID/media_publish" -d "creation_id=$MAIN_ID" -d "access_token=$CLEAN_META_TOKEN")
          IG_POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          echo "✅ [IG] 主文發布完成 ID: $IG_POST_ID"
          
          echo "📤 [IG] 準備依序發布 4 則留言..."
          if [ "$IG_POST_ID" != "null" ] && [ -n "$IG_POST_ID" ]; then
            for i in {1..4}; do
              if [ -f "comment${i}.txt" ]; then
                echo "📤 [IG] 發布留言 ${i}..."
                IG_COMMENT_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$IG_POST_ID/comments" \
                     --data-urlencode message@comment${i}.txt \
                     -d "access_token=$CLEAN_META_TOKEN")
                IG_COMMENT_ID=$(echo $IG_COMMENT_RES | jq -r '.id')
                
                if [ "$IG_COMMENT_ID" != "null" ] && [ -n "$IG_COMMENT_ID" ]; then
                  echo "✅ [IG] 留言 $i 發布成功！ID: $IG_COMMENT_ID"
                else
                  echo "❌ [IG] 留言 $i 發布失敗！Meta 回傳：$IG_COMMENT_RES"
                fi
                sleep 15
              fi
            done
            echo "🎉 [IG] 留言發佈完成！"
          else
            echo "❌ [IG] 找不到主文 ID，跳過留言發佈。"
          fi

      - name: Post to Facebook Page (Multi-Photo)
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          # 🛡️ 淨化 Token 與 ID
          CLEAN_META_TOKEN=$(echo -n "$META_TOKEN" | tr -d '\r\n ')
          CLEAN_FB_PAGE_ID=$(echo -n "$FB_PAGE_ID" | tr -d '\r\n ')
          
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          
          # 初始化變數
          ATTACHED_MEDIA="["
          PHOTO_COUNT=0
          
          echo "📤 [FB] 正在上傳未公開的照片..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}"
            echo "🔍 準備上傳: $IMG_URL"
            
            RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_FB_PAGE_ID/photos" \
                 -d "url=$IMG_URL" \
                 -d "published=false" \
                 -d "access_token=$CLEAN_META_TOKEN")
                 
            PHOTO_ID=$(echo $RES | jq -r '.id')
            
            if [ "$PHOTO_ID" != "null" ] && [ -n "$PHOTO_ID" ]; then
              ATTACHED_MEDIA+="{\"media_fbid\":\"$PHOTO_ID\"},"
              PHOTO_COUNT=$((PHOTO_COUNT+1))
              echo "✅ 圖片上傳成功，取得 Media ID: $PHOTO_ID"
            else
              echo "❌ 圖片上傳異常！Meta 回傳：$RES"
            fi
            sleep 3
          done
          
          # 防呆：如果沒有任何照片上傳成功，就直接中斷，避免發出空貼文
          if [ "$PHOTO_COUNT" -eq 0 ]; then
             echo "❌ [FB] 致命錯誤：沒有任何照片成功上傳到暫存區，終止發文！"
             exit 1
          fi
          
          # 收尾 JSON 陣列 (移除最後一個多餘的逗號並加上右括號)
          ATTACHED_MEDIA=${ATTACHED_MEDIA%,}"]"
          echo "🔍 [FB Debug] 準備送出的 attached_media 結構：$ATTACHED_MEDIA"
          
          echo "📤 [FB] 正在發布多圖主文..."
          # ⚠️ 關鍵修正：將 attached_media 改用 --data-urlencode，確保 JSON 符號不被破壞
          PUBLISH_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$CLEAN_FB_PAGE_ID/feed" \
               --data-urlencode message@caption.txt \
               --data-urlencode "attached_media=$ATTACHED_MEDIA" \
               -d "access_token=$CLEAN_META_TOKEN")
               
          FB_POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          
          # 攔截發文失敗的狀況
          if [ "$FB_POST_ID" == "null" ] || [ -z "$FB_POST_ID" ]; then
             echo "❌ [FB] 致命錯誤：主文發布失敗！請檢查 Meta 錯誤訊息："
             echo "🤖 Meta API 回傳：$PUBLISH_RES"
             exit 1
          fi
          
          echo "✅ [FB] 主文發布完成 ID: $FB_POST_ID"
          
          echo "📤 [FB] 準備依序發布 4 則留言..."
          for i in {1..4}; do
            if [ -f "comment${i}.txt" ]; then
              echo "📤 [FB] 發布留言 ${i}..."
              # 這裡改為印出回應，以便觀察留言是否被阻擋
              COMMENT_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$FB_POST_ID/comments" \
                   --data-urlencode message@comment${i}.txt \
                   -d "access_token=$CLEAN_META_TOKEN")
              
              COMMENT_ID=$(echo $COMMENT_RES | jq -r '.id')
              if [ "$COMMENT_ID" != "null" ] && [ -n "$COMMENT_ID" ]; then
                 echo "✅ [FB] 留言 $i 發佈成功"
              else
                 echo "❌ [FB] 留言 $i 發佈失敗！Meta 回傳：$COMMENT_RES"
              fi
              sleep 15
            fi
          done
          echo "🎉 [FB] 所有流程執行完畢！"
