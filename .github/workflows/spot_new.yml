name: Spot Auto Poster Newon:workflow_dispatch:schedule:- cron: '0 10 * * 1,5'concurrency:group: auto-poster-queuecancel-in-progress: falsejobs:build:runs-on: ubuntu-latestpermissions:contents: writesteps:- name: Checkout Repositoryuses: actions/checkout@v4  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Install dependencies
    run: pip install google-genai requests pillow

  - name: Run Script
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python daily_spot.py

  - name: Commit to GitHub
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add .
      git commit -m "Auto Update Spot Posts" || echo "No changes"
      git pull --rebase origin main || true
      git push

  - name: Wait for GitHub Pages to Deploy
    run: |
      OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
      REPO=$(basename "${{ github.repository }}")
      BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
      IMG_NAMES=$(cat img_names.txt)
      IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
      FIRST_IMG_URL="${BASE_URL}/${IMG_ARRAY[0]}"
      
      echo "Waiting for $FIRST_IMG_URL"
      for i in {1..20}; do
        HTTP_STATUS=$(curl -o /dev/null -s -w "\%{http_code}\n" "$FIRST_IMG_URL")
        if [ "$HTTP_STATUS" == "200" ]; then
          echo "Online"
          break
        fi
        sleep 15
      done
      sleep 10

  - name: Post to Threads
    env:
      TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
    run: |
      OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
      REPO=$(basename "${{ github.repository }}")
      BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
      IMG_NAMES=$(cat img_names.txt)
      IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
      
      CHILDREN=""
      for img in "${IMG_ARRAY[@]}"; do
        IMG_URL="${BASE_URL}/${img}"
        RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=IMAGE" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$TOKEN")
        ID=$(echo$RES | jq -r '.id')
        if [ "$ID" != "null" ] && [ -n "$ID" ]; then
          CHILDREN="${CHILDREN}${ID},"
        fi
      done
      CHILDREN=${CHILDREN%,}
      
      sleep 15
      RES_MAIN=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode text@caption.txt -d "access_token=$TOKEN")
      MAIN_ID=$(echo$RES_MAIN | jq -r '.id')
      
      sleep 15
      PUBLISH_RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$MAIN_ID&access_token=$TOKEN")
      POST_ID=$(echo$PUBLISH_RES | jq -r '.id')
      
      for i in {1..10}; do
        if [ -f "comment${i}.txt" ]; then
          curl -s -X POST "https://graph.threads.net/v1.0/me/threads" --data-urlencode "media_type=TEXT" --data-urlencode text@comment${i}.txt --data-urlencode "reply_to_id=$POST_ID" --data-urlencode "access_token=$TOKEN" > temp_res.json
          COMMENT_ID=$(cat temp_res.json | jq -r '.id')
          curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$COMMENT_ID&access_token=$TOKEN" > /dev/null
          sleep 5
        fi
      done

  - name: Post to Instagram
    env:
      META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_ID: ${{ secrets.IG_USER_ID }}
    run: |
      OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
      REPO=$(basename "${{ github.repository }}")
      BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
      IMG_NAMES=$(cat img_names.txt)
      IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
      
      CHILDREN=""
      for img in "${IMG_ARRAY[@]}"; do
        IMG_URL="${BASE_URL}/${img}"
        RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$IG_ID/media" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$META_TOKEN")
        ID=$(echo$RES | jq -r '.id')
        if [ "$ID" != "null" ] && [ -n "$ID" ]; then
          CHILDREN="${CHILDREN}${ID},"
        fi
      done
      CHILDREN=${CHILDREN%,}
      
      sleep 20
      RES_MAIN=$(curl -s -X POST "https://graph.facebook.com/v20.0/$IG_ID/media" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode caption@caption.txt -d "access_token=$META_TOKEN")
      MAIN_ID=$(echo$RES_MAIN | jq -r '.id')
      
      sleep 15
      curl -s -X POST "https://graph.facebook.com/v20.0/$IG_ID/media_publish" -d "creation_id=$MAIN_ID" -d "access_token=$META_TOKEN"

  - name: Post to Facebook Page
    env:
      META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    run: |
      OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
      REPO=$(basename "${{ github.repository }}")
      BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
      IMG_NAMES=$(cat img_names.txt)
      IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
      
      ATTACHED_MEDIA="["
      for img in "${IMG_ARRAY[@]}"; do
        IMG_URL="${BASE_URL}/${img}"
        RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$FB_PAGE_ID/photos" -d "url=$IMG_URL" -d "published=false" -d "access_token=$META_TOKEN")
        PHOTO_ID=$(echo$RES | jq -r '.id')
        if [ "$PHOTO_ID" != "null" ] && [ -n "$PHOTO_ID" ]; then
          ATTACHED_MEDIA+="{\"media_fbid\":\"$PHOTO_ID\"},"
        fi
      done
      ATTACHED_MEDIA=${ATTACHED_MEDIA%,}"]"
      
      curl -s -X POST "https://graph.facebook.com/v20.0/$FB_PAGE_ID/feed" --data-urlencode message@caption.txt -d "attached_media=$ATTACHED_MEDIA" -d "access_token=$META_TOKEN"
