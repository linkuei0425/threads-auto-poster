name: "Spot Auto Poster New"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 10 * * 1,5'

concurrency:
  group: "auto-poster-queue"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai requests pillow

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_spot.py

      - name: Commit to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto Update Spot Posts (8 Carousel Images)" || echo "No changes"
          git pull --rebase origin main || true
          git push

      - name: Wait for GitHub Pages to Deploy
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          FIRST_IMG_URL="${BASE_URL}/${IMG_ARRAY[0]}"
          
          echo "🔍 正在等待首圖上線：$FIRST_IMG_URL"
          for i in {1..20}; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" "$FIRST_IMG_URL")
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "✅ 圖片已成功上線！"
              break
            fi
            echo "⏳ 尚未上線 (狀態碼: $HTTP_STATUS)... 等待 15 秒後重試 ($i/20)"
            sleep 15
          done
          sleep 10

      - name: Post to Threads (Carousel + 4 Comments)
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          CHILDREN=""
          
          echo "📤 [Threads] 正在上傳 8 張圖片至暫存區..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}"
            RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=IMAGE" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$TOKEN")
            ID=$(echo $RES | jq -r '.id')
            if [ "$ID" != "null" ] && [ -n "$ID" ]; then
              CHILDREN="${CHILDREN}${ID},"
            fi
          done
          CHILDREN=${CHILDREN%,}
          
          sleep 5
          echo "📤 [Threads] 正在建立輪播主文容器..."
          RES_MAIN=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode text@caption.txt -d "access_token=$TOKEN")
          MAIN_ID=$(echo $RES_MAIN | jq -r '.id')
          
          echo "⏳ [Threads] 正在等待 Meta 伺服器轉檔處理 8 張圖片..."
          for j in {1..15}; do
            STATUS_RES=$(curl -s -X GET "https://graph.threads.net/v1.0/$MAIN_ID?fields=status,error_message&access_token=$TOKEN")
            STATUS=$(echo $STATUS_RES | jq -r '.status')
            if [ "$STATUS" == "FINISHED" ]; then
              echo "✅ [Threads] 伺服器處理完成！準備發布！"
              break
            fi
            if [ "$STATUS" == "ERROR" ]; then
              ERR_MSG=$(echo $STATUS_RES | jq -r '.error_message')
              echo "❌ [Threads] 伺服器處理失敗：$ERR_MSG"
              exit 1
            fi
            echo "⏳ 處理中 (目前狀態: $STATUS)... 等待 10 秒後重試 ($j/15)"
            sleep 10
          done

          echo "📤 [Threads] 正在正式發布貼文..."
          PUBLISH_RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$MAIN_ID&access_token=$TOKEN")
          POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          echo "✅ [Threads] 主文發布成功！ID: $POST_ID"
          
          echo "📤 [Threads] 準備依序發布 4 則交通資訊留言..."
          for i in {1..4}; do
            if [ -f "comment${i}.txt" ]; then
              curl -s -X POST "https://graph.threads.net/v1.0/me/threads" --data-urlencode "media_type=TEXT" --data-urlencode text@comment${i}.txt --data-urlencode "reply_to_id=$POST_ID" --data-urlencode "access_token=$TOKEN" > temp_res.json
              COMMENT_ID=$(cat temp_res.json | jq -r '.id')
              curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$COMMENT_ID&access_token=$TOKEN" > /dev/null
              echo "✅ [Threads] 留言 $i 發布成功"
              sleep 15
            fi
          done

      - name: Post to Instagram (Carousel)
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          CHILDREN=""
          
          echo "📤 [IG] 正在上傳圖片至暫存區..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}"
            RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$IG_ID/media" -d "image_url=$IMG_URL" -d "is_carousel_item=true" -d "access_token=$META_TOKEN")
            ID=$(echo $RES | jq -r '.id')
            if [ "$ID" != "null" ] && [ -n "$ID" ]; then
              CHILDREN="${CHILDREN}${ID},"
            fi
          done
          CHILDREN=${CHILDREN%,}
          
          sleep 5
          echo "📤 [IG] 正在建立輪播主文容器..."
          RES_MAIN=$(curl -s -X POST "https://graph.facebook.com/v20.0/$IG_ID/media" -d "media_type=CAROUSEL" -d "children=$CHILDREN" --data-urlencode caption@caption.txt -d "access_token=$META_TOKEN")
          MAIN_ID=$(echo $RES_MAIN | jq -r '.id')
          
          echo "⏳ [IG] 正在等待 Meta 伺服器轉檔處理 8 張圖片..."
          for j in {1..15}; do
            STATUS_RES=$(curl -s -X GET "https://graph.facebook.com/v20.0/$MAIN_ID?fields=status_code&access_token=$META_TOKEN")
            STATUS=$(echo $STATUS_RES | jq -r '.status_code')
            if [ "$STATUS" == "FINISHED" ]; then
              echo "✅ [IG] 伺服器處理完成！準備發布！"
              break
            fi
            if [ "$STATUS" == "ERROR" ]; then
              echo "❌ [IG] 伺服器處理失敗！"
              exit 1
            fi
            echo "⏳ 處理中 (目前狀態: $STATUS)... 等待 10 秒後重試 ($j/15)"
            sleep 10
          done

          echo "📤 [IG] 正在正式發布貼文..."
          PUBLISH_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$IG_ID/media_publish" -d "creation_id=$MAIN_ID" -d "access_token=$META_TOKEN")
          IG_POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          echo "✅ [IG] 主文發布完成 ID: $IG_POST_ID"
          
          echo "📤 [IG] 準備依序發布 4 則留言..."
          if [ "$IG_POST_ID" != "null" ] && [ -n "$IG_POST_ID" ]; then
            for i in {1..4}; do
              if [ -f "comment${i}.txt" ]; then
                echo "📤 [IG] 發布留言 ${i}..."
                curl -s -X POST "https://graph.facebook.com/v20.0/$IG_POST_ID/comments" --data-urlencode message@comment${i}.txt -d "access_token=$META_TOKEN" > /dev/null
                sleep 5
              fi
            done
            echo "✅ [IG] 留言發佈完成！"
          else
            echo "❌ [IG] 找不到主文 ID，跳過留言發佈。"
          fi

      - name: Post to Facebook Page (Multi-Photo)
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          BASE_URL="https://${OWNER}.github.io/${REPO}/images/SPOT"
          IMG_NAMES=$(cat img_names.txt)
          IFS=',' read -r -a IMG_ARRAY <<< "$IMG_NAMES"
          ATTACHED_MEDIA="["
          
          echo "📤 [FB] 正在上傳未公開的照片..."
          for img in "${IMG_ARRAY[@]}"; do
            IMG_URL="${BASE_URL}/${img}"
            RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$FB_PAGE_ID/photos" -d "url=$IMG_URL" -d "published=false" -d "access_token=$META_TOKEN")
            PHOTO_ID=$(echo $RES | jq -r '.id')
            if [ "$PHOTO_ID" != "null" ] && [ -n "$PHOTO_ID" ]; then
              ATTACHED_MEDIA+="{\"media_fbid\":\"$PHOTO_ID\"},"
            fi
          done
          ATTACHED_MEDIA=${ATTACHED_MEDIA%,}"]"
          
          echo "📤 [FB] 正在發布多圖貼文..."
          PUBLISH_RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/$FB_PAGE_ID/feed" --data-urlencode message@caption.txt -d "attached_media=$ATTACHED_MEDIA" -d "access_token=$META_TOKEN")
          FB_POST_ID=$(echo $PUBLISH_RES | jq -r '.id')
          echo "✅ [FB] 主文發布完成 ID: $FB_POST_ID"
          
          echo "📤 [FB] 準備依序發布 4 則留言..."
          if [ "$FB_POST_ID" != "null" ] && [ -n "$FB_POST_ID" ]; then
            for i in {1..4}; do
              if [ -f "comment${i}.txt" ]; then
                echo "📤 [FB] 發布留言 ${i}..."
                curl -s -X POST "https://graph.facebook.com/v20.0/$FB_POST_ID/comments" --data-urlencode message@comment${i}.txt -d "access_token=$META_TOKEN" > /dev/null
                sleep 5
              fi
            done
            echo "✅ [FB] 留言發佈完成！"
          else
            echo "❌ [FB] 找不到主文 ID，跳過留言發佈。"
          fi
