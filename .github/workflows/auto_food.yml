name: "美食 (FB/IG/Threads Multi-Platform)"on:workflow_dispatch:schedule:- cron: "0 10 * * 1,5"jobs:build_and_post:runs-on: ubuntu-latestpermissions:contents: writesteps:- name: Checkout Codeuses: actions/checkout@v4  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"
      
  - name: Install Dependencies
    run: pip install google-genai requests
    
  - name: Run AI script
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python daily_spot.py
    
  - name: Push Image to GitHub
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add images/SPOT/*.jpg
      git add selected_city.txt 
      git commit -m "Update Spot Images & City" || echo "No changes"
      git push

  - name: Wait for GitHub Pages to Deploy
    run: |
      IMG_NAMES=$(cat img_names.txt | tr -d '\r\n')
      FIRST_IMG=$(echo$IMG_NAMES | cut -d',' -f1)
      IMG_URL="https://linkuei0425.github.io/threads-auto-poster/images/SPOT/$FIRST_IMG"
      for i in {1..20}; do
        HTTP_STATUS=$(curl -o /dev/null -s -w "\%{http_code}\n" "$IMG_URL")
        if [ "$HTTP_STATUS" == "200" ]; then echo "Image Online!"; break; fi
        sleep 15
      done
      sleep 5

  - name: Post to Threads
    continue-on-error: true
    env:
      TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
    run: |
      IMG_NAMES=$(cat img_names.txt | tr -d '\r\n')
      IFS=',' read -ra IMGS <<< "$IMG_NAMES"
      CHILDREN_IDS=""
      for IMG in "${IMGS[@]}"; do
        IMG_URL="https://linkuei0425.github.io/threads-auto-poster/images/SPOT/$IMG"
        RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" --data-urlencode "media_type=IMAGE" --data-urlencode "image_url=$IMG_URL" --data-urlencode "is_carousel_item=true" --data-urlencode "access_token=$TOKEN")
        ITEM_ID=$(echo$RES | jq -r '.id')
        if [ "$ITEM_ID" != "null" ] && [ -n "$ITEM_ID" ]; then
          if [ -z "$CHILDREN_IDS" ]; then CHILDREN_IDS="$ITEM_ID"; else CHILDREN_IDS="$CHILDREN_IDS,$ITEM_ID"; fi
        fi
        sleep 3
      done
      RES_MAIN=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" --data-urlencode "media_type=CAROUSEL" --data-urlencode "children=$CHILDREN_IDS" --data-urlencode text@caption.txt --data-urlencode "access_token=$TOKEN")
      MAIN_ID=$(echo$RES_MAIN | jq -r '.id')
      sleep 10
      POST_RES=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$MAIN_ID&access_token=$TOKEN")
      POST_ID=$(echo$POST_RES | jq -r '.id')
      RES_C1=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" --data-urlencode "media_type=TEXT" --data-urlencode text@comment.txt --data-urlencode "reply_to_id=$POST_ID" --data-urlencode "access_token=$TOKEN")
      curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$(echo $RES_C1 \vert{} jq -r '.id')&access_token=$TOKEN"
      sleep 5
      RES_C2=$(curl -s -X POST "https://graph.threads.net/v1.0/me/threads" --data-urlencode "media_type=TEXT" --data-urlencode text@comment2.txt --data-urlencode "reply_to_id=$POST_ID" --data-urlencode "access_token=$TOKEN")
      curl -s -X POST "https://graph.threads.net/v1.0/me/threads_publish?creation_id=$(echo $RES_C2 \vert{} jq -r '.id')&access_token=$TOKEN"

  - name: Post to Instagram
    continue-on-error: true
    env:
      TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
    run: |
      IMG_NAMES=$(cat img_names.txt | tr -d '\r\n')
      IFS=',' read -ra IMGS <<< "$IMG_NAMES"
      IG_CHILDREN=""
      for IMG in "${IMGS[@]}"; do
        IMG_URL="https://linkuei0425.github.io/threads-auto-poster/images/SPOT/$IMG"
        RES=$(curl -s -X POST "https://graph.facebook.com/v19.0/$ACCOUNT_ID/media" --data-urlencode "image_url=$IMG_URL" --data-urlencode "is_carousel_item=true" -d "access_token=$TOKEN")
        ITEM_ID=$(echo$RES | jq -r '.id')
        if [ "$ITEM_ID" != "null" ] && [ -n "$ITEM_ID" ]; then
          if [ -z "$IG_CHILDREN" ]; then IG_CHILDREN="$ITEM_ID"; else IG_CHILDREN="$IG_CHILDREN,$ITEM_ID"; fi
        fi
        sleep 3
      done
      RES_MAIN=$(curl -s -X POST "https://graph.facebook.com/v19.0/$ACCOUNT_ID/media" --data-urlencode "media_type=CAROUSEL" --data-urlencode "children=$IG_CHILDREN" --data-urlencode caption@caption.txt -d "access_token=$TOKEN")
      MAIN_ID=$(echo$RES_MAIN | jq -r '.id')
      sleep 15
      POST_RES=$(curl -s -X POST "https://graph.facebook.com/v19.0/$ACCOUNT_ID/media_publish" -d "creation_id=$MAIN_ID" -d "access_token=$TOKEN")
      IG_POST_ID=$(echo$POST_RES | jq -r '.id')
      curl -s -X POST "https://graph.facebook.com/v19.0/$IG_POST_ID/comments" --data-urlencode message@comment.txt -d "access_token=$TOKEN"
      sleep 5
      curl -s -X POST "https://graph.facebook.com/v19.0/$IG_POST_ID/comments" --data-urlencode message@comment2.txt -d "access_token=$TOKEN"

  - name: Post to Facebook Page
    continue-on-error: true
    env:
      TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    run: |
      IMG_NAMES=$(cat img_names.txt | tr -d '\r\n')
      IFS=',' read -ra IMGS <<< "$IMG_NAMES"
      FB_MEDIA_IDS=()
      for IMG in "${IMGS[@]}"; do
        IMG_URL="https://linkuei0425.github.io/threads-auto-poster/images/SPOT/$IMG"
        RES=$(curl -s -X POST "https://graph.facebook.com/v19.0/$PAGE_ID/photos" --data-urlencode "url=$IMG_URL" -d "published=false" -d "access_token=$TOKEN")
        ID=$(echo$RES | jq -r '.id')
        if [ "$ID" != "null" ] && [ -n "$ID" ]; then
          FB_MEDIA_IDS+=("$ID")
        fi
        sleep 3
      done
      MEDIA_JSON="["
      for ID in "${FB_MEDIA_IDS[@]}"; do
        if [ "$MEDIA_JSON" != "[" ]; then MEDIA_JSON+=","; fi
        MEDIA_JSON+="{\"media_fbid\":\"$ID\"}"
      done
      MEDIA_JSON+="]"
      FB_POST_RES=$(curl -s -X POST "https://graph.facebook.com/v19.0/$PAGE_ID/feed" --data-urlencode message@caption.txt --data-urlencode "attached_media=$MEDIA_JSON" -d "access_token=$TOKEN")
      FB_POST_ID=$(echo$FB_POST_RES | jq -r '.id')
      curl -s -X POST "https://graph.facebook.com/v19.0/$FB_POST_ID/comments" --data-urlencode message@comment.txt -d "access_token=$TOKEN"
      sleep 5
      curl -s -X POST "https://graph.facebook.com/v19.0/$FB_POST_ID/comments" --data-urlencode message@comment2.txt -d "access_token=$TOKEN"
      echo "🎉 全部發布完成！"


